[project]
name = "chatappliction"
version = "0.1.0"
description = "Basic chat application using the daphene and the django channels"
authors = [
    {name = "Yash Chauhan",email = "yashc9411407582@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (==5.1.6)",
    "djangorestframework (==3.15.2)",
    "django-cors-headers (==4.7.0)",
    "channels (==4.2.0)",
    "channels-redis (==4.2.1)",
    "daphne (==4.1.2)",
    "black (==25.1.0)",
    "psycopg[binary] (==3.2.6)",
    "python-dotenv (==1.0.1)",
    "whitenoise (>=6.9.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
